[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "apex-portal-api"
version = "0.1.0"
description = "FastAPI read API for the APEX progress portal."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0,<0.32",
    "fastapi>=0.115.0,<0.116",
    "pydantic-settings>=2.10.0,<3",
    "uvicorn>=0.37.0,<0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<0.29",
    "pytest>=8.4.0,<9",
    "ruff>=0.14.0,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apex_portal_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
